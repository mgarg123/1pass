name: one_pass
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.2.2+20

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0
  flutter_riverpod: ^3.3.2
  equatable: ^2.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.3.1
  uuid: ^4.5.3
  supabase_flutter: ^2.15.4
  connectivity_plus: 6.1.5
  flutter_dotenv: ^6.0.1
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  file_picker: ^10.3.10
  share_plus: any
  package_info_plus: ^9.0.1
  dio: ^5.10.0
  path_provider: ^2.1.6
  open_file: ^4.0.0
  url_launcher: ^6.3.2
  otp: ^3.2.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.3
  google_sign_in: ^6.2.2
  qr_flutter: ^4.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_native_splash:
  color: "#000000"
  image: assets/images/1pass-splash.png
  color_dark: "#000000"
  image_dark: assets/images/1pass-splash.png
  android: true
  ios: true
  web: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/1pass.png"
  background_color: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/1pass.png"
  web:
    generate: true
    image_path: "assets/images/1pass.png"
    background_color: "#000000"
  remove_alpha_ios: true
  min_sdk_android: 21
